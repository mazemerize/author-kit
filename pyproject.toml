[project]
name = "authorkit-cli"
version = "0.6.2"
description = "Author Kit CLI installer and updater"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "mutagen>=1.45",
]

[project.scripts]
authorkit = "authorkit_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/authorkit_cli"]

[tool.hatch.build.targets.wheel.force-include]
".authorkit" = "authorkit_cli/assets/.authorkit"
